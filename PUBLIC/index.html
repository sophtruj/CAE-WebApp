<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Items Demo (SQLite)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.5rem; }
    form { display: flex; gap: 0.5rem; margin: 1rem 0; }
    input { flex: 1; padding: 0.5rem; }
    button { padding: 0.5rem 0.75rem; cursor: pointer; }
    li { padding: 0.35rem 0; border-bottom: 1px solid #eee; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>Items</h1>
  <p><small>This page calls <code>/api/items</code> on the same server. Data is stored in <code>data/app.db</code>.</small></p>

  <form id="add-form" autocomplete="off">
    <input id="name" placeholder="New item name" required />
    <button type="submit">Add</button>
  </form>

  <ul id="list" aria-live="polite"></ul>

  <script>
    async function load() {
      const res = await fetch('/api/items');
      const items = await res.json();
      const ul = document.getElementById('list');
      ul.innerHTML = '';
      for (const it of items) {
        const li = document.createElement('li');
        const date = it.created_at ? new Date(it.created_at) : null;
        li.textContent = `${it.id} — ${it.name}` + (date ? ` (${date.toLocaleString()})` : '');
        ul.appendChild(li);
      }
    }

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('name');
      const name = input.value.trim();
      if (!name) return;
      const res = await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      if (!res.ok) {
        alert('Insert failed');
        return;
      }
      input.value = '';
      load();
    });

    load();
  </script>
</body>
</html>
